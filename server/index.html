<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captcha Test</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
  img { border: 1px solid #333; margin: 10px 0; display: block; }
  input { padding: 8px; width: 100%; box-sizing: border-box; margin: 6px 0; }
  .pw-row { display: flex; align-items: center; gap: 8px; }
  .pw-row input { flex: 1; margin: 6px 0; }
  button { padding: 8px 16px; margin: 6px 4px 6px 0; cursor: pointer; }
  pre { background: #f4f4f4; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  label { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h2>MyResult Captcha + Login Tester</h2>

  <button onclick="loadCaptcha()">Get New Captcha</button>
  <div>
    <label>Session ID:</label>
    <input type="text" id="sessionId" readonly>
  </div>
  <img id="captchaImg" src="" alt="Captcha will appear here" width="180">

  <hr>

  <label>Enrollment No (username)</label>
  <input type="text" id="username" placeholder="e.g. 03993xxxxx">

  <label>Password</label>
  <div class="pw-row">
    <input type="password" id="password">
    <button type="button" onclick="togglePassword()" id="toggleBtn">Show</button>
  </div>

  <label>Captcha Text (type what you see above)</label>
  <input type="text" id="captchaText">

  <button onclick="doLogin()">Login</button>

  <h3>Response:</h3>
  <pre id="output">--</pre>

<script>
const BASE_URL = "http://localhost:5000";

function togglePassword() {
  const pw = document.getElementById('password');
  const btn = document.getElementById('toggleBtn');
  if (pw.type === 'password') {
    pw.type = 'text';
    btn.textContent = 'Hide';
  } else {
    pw.type = 'password';
    btn.textContent = 'Show';
  }
}

function saveCreds() {
  localStorage.setItem('myresult_username', document.getElementById('username').value);
  localStorage.setItem('myresult_password', document.getElementById('password').value);
}

function loadCreds() {
  const u = localStorage.getItem('myresult_username');
  const p = localStorage.getItem('myresult_password');
  if (u) document.getElementById('username').value = u;
  if (p) document.getElementById('password').value = p;
}

async function loadCaptcha() {
  const out = document.getElementById('output');
  out.textContent = "Loading captcha...";
  try {
    const res = await fetch(`${BASE_URL}/api/auth/captcha`);
    const data = await res.json();
    document.getElementById('sessionId').value = data.sessionId || '';
    document.getElementById('captchaImg').src = data.captchaImage || '';
    out.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    out.textContent = "Error fetching captcha: " + err.message;
  }
}

async function doLogin() {
  saveCreds();
  const out = document.getElementById('output');
  out.textContent = "Logging in...";
  const payload = {
    sessionId: document.getElementById('sessionId').value,
    username: document.getElementById('username').value,
    password: document.getElementById('password').value,
    captchaText: document.getElementById('captchaText').value
  };
  try {
    const res = await fetch(`${BASE_URL}/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    out.textContent = "Error logging in: " + err.message;
  }
}

// auto-load captcha and saved creds on page open
loadCaptcha();
loadCreds();
</script>
</body>
</html>
